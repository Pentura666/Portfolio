<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gallery — Igor Nikitchenko</title>
  <meta name="description" content="Photo gallery — Igor Nikitchenko Lighting Designer" />
  <link rel="stylesheet" href="style.css?v=6" />
  <style>
    .gallery-masonry {
      columns: 3;
      column-gap: 8px;
    }
    .gallery-masonry-item {
      break-inside: avoid;
      margin-bottom: 8px;
      border-radius: 4px;
      overflow: hidden;
      background: #111;
      display: block;
    }
    .gallery-masonry-item img {
      width: 100%;
      display: block;
      transition: transform 0.3s;
    }
    .gallery-masonry-item:hover img {
      transform: scale(1.03);
    }
    .gallery-loading {
      text-align: center;
      color: var(--text-muted, #888);
      padding: 60px 0;
      font-size: 14px;
    }
    @media (max-width: 900px) {
      .gallery-masonry { columns: 2; }
    }
    @media (max-width: 500px) {
      .gallery-masonry { columns: 1; }
    }
    .gallery-masonry-item { cursor: zoom-in; }
    #wave-bg { opacity: 0.45; } /* cubes dimmer here than on other pages (0.65), so photos lead */

    /* lightbox: click a photo -> full screen; click / wheel / pinch to zoom, drag to pan */
    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 1000;
      background: rgba(10, 10, 10, 0.96);
      display: none;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
    .lightbox.open { display: block; }
    /* starts as a point in the middle; GSAP opens it to the full screen */
    .lightbox { clip-path: inset(50% 50% 50% 50%); will-change: clip-path; }
    .lightbox-stage {
      position: absolute;
      inset: 0;
      overflow: hidden;
      cursor: zoom-in;
    }
    .lightbox-stage.zoomed { cursor: grab; }
    .lightbox-stage.dragging { cursor: grabbing; }
    .lightbox-img {
      position: absolute;
      top: 50%;
      left: 50%;
      max-width: 92vw;
      max-height: 86vh;
      transform-origin: 0 0;
      will-change: transform;
      -webkit-user-drag: none;
    }
    .lightbox-btn {
      position: absolute;
      z-index: 2;
      width: 48px;
      height: 48px;
      border: 1px solid var(--border, #2e2e2e);
      border-radius: 50%;
      background: rgba(17, 17, 17, 0.8);
      color: var(--text, #fff);
      font: 400 20px/1 var(--font-primary, monospace);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: border-color 0.2s, color 0.2s;
    }
    .lightbox-btn:hover { border-color: var(--primary, #ff8400); color: var(--primary, #ff8400); }
    .lightbox-close { top: 16px; right: 16px; }
    .lightbox-prev { left: 16px; top: 50%; transform: translateY(-50%); }
    .lightbox-next { right: 16px; top: 50%; transform: translateY(-50%); }
    .lightbox-bar {
      position: absolute;
      z-index: 2;
      left: 50%;
      bottom: 16px;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 8px;
      font: 400 12px var(--font-primary, monospace);
      color: var(--text-muted, #b8b9b6);
      letter-spacing: 1px;
    }
    .lightbox-bar .lightbox-btn { position: static; width: 40px; height: 40px; }
    .lightbox-btn svg { display: block; pointer-events: none; }
    .lightbox-count { min-width: 64px; text-align: center; }
    @media (max-width: 600px) {
      .lightbox-prev, .lightbox-next { top: auto; bottom: 12px; transform: none; width: 40px; height: 40px; }
      .lightbox-bar { bottom: 70px; }
      .lightbox-img { max-width: 100vw; max-height: 80vh; }
    }
  </style>
  <script data-goatcounter="https://pntrlcht.goatcounter.com/count"
          async src="//gc.zgo.at/count.js"></script>
</head>

<div class="page-header">
  <div class="container">
    <h1>Gallery</h1>
    <p>Photography from productions and installations</p>
  </div>
</div>

<section class="section">
  <div class="container">
    <div class="gallery-masonry" id="gallery"></div>
    <div class="gallery-loading" id="gallery-loading">Loading photos...</div>
  </div>
</section>

<footer>
  <div class="container">
    <p>&copy; 2026 Igor Nikitchenko. All rights reserved.</p>
  </div>
</footer>

<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Photo viewer">
  <div class="lightbox-stage" id="lightbox-stage">
    <img class="lightbox-img" id="lightbox-img" alt="" draggable="false" />
  </div>
  <button class="lightbox-btn lightbox-close" id="lightbox-close" aria-label="Close">&times;</button>
  <button class="lightbox-btn lightbox-prev" id="lightbox-prev" aria-label="Previous photo">&larr;</button>
  <button class="lightbox-btn lightbox-next" id="lightbox-next" aria-label="Next photo">&rarr;</button>
  <div class="lightbox-bar">
    <button class="lightbox-btn" id="lightbox-zoom-out" aria-label="Zoom out"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="8" y1="11" x2="14" y2="11"/></svg></button>
    <span class="lightbox-count" id="lightbox-count"></span>
    <button class="lightbox-btn" id="lightbox-zoom-in" aria-label="Zoom in"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></svg></button>
  </div>
</div>

<script>
(function() {
  var gallery = document.getElementById('gallery');
  var loading = document.getElementById('gallery-loading');
  var repo = 'Pentura666/Portfolio';
  var folder = 'photos';
  var imageExts = ['jpg', 'jpeg', 'png', 'webp', 'gif'];

  fetch('https://api.github.com/repos/' + repo + '/contents/' + folder)
    .then(function(r) { return r.json(); })
    .then(function(files) {
      loading.style.display = 'none';
      files
        .filter(function(f) {
          var ext = f.name.split('.').pop().toLowerCase();
          return imageExts.indexOf(ext) !== -1;
        })
        .sort(function(a, b) { return a.name.localeCompare(b.name); })
        .forEach(function(f) {
          var item = document.createElement('div');
          item.className = 'gallery-masonry-item';
          var img = document.createElement('img');
          img.src = 'photos/' + f.name;
          img.alt = f.name;
          img.loading = 'lazy';
          item.appendChild(img);
          gallery.appendChild(item);
        });
    })
    .catch(function() {
      loading.textContent = 'Could not load gallery.';
    });
})();

</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
<script>
/* Lightbox: click photo -> full screen. Zoom: click the photo, wheel, pinch, +/- buttons/keys.
   Drag to pan when zoomed. Arrows / swipe / keys for prev-next, Esc or click outside to close. */
(function() {
  var box = document.getElementById('lightbox');
  var stage = document.getElementById('lightbox-stage');
  var img = document.getElementById('lightbox-img');
  var countEl = document.getElementById('lightbox-count');
  var MAX = 5;
  var photos = [], index = 0;
  var s = 1, tx = 0, ty = 0, w = 0, h = 0;
  var pointers = {}, drag = null, moved = false;

  // s / tx / ty = where the photo is going; ds / dtx / dty = what is drawn. Zoom glides toward the target
  // (eased follow, frame-rate independent); dragging and pinching draw directly so the photo stays under the finger.
  var ds = 1, dtx = 0, dty = 0, gliding = false, lastT = 0;
  var GLIDE = 10; // higher = snappier zoom, lower = floatier

  function draw() {
    img.style.transform = 'translate(' + dtx + 'px,' + dty + 'px) scale(' + ds + ')';
  }
  function glide(now) {
    var dt = Math.min((now - lastT) / 1000, 0.05); lastT = now;
    var k = 1 - Math.exp(-dt * GLIDE);
    ds += (s - ds) * k; dtx += (tx - dtx) * k; dty += (ty - dty) * k;
    if (Math.abs(s - ds) < 0.0005 && Math.abs(tx - dtx) < 0.2 && Math.abs(ty - dty) < 0.2) {
      ds = s; dtx = tx; dty = ty; gliding = false;
    }
    draw();
    if (gliding) requestAnimationFrame(glide);
  }
  function apply(animate) {
    stage.classList.toggle('zoomed', s > 1.01);
    if (!animate) { gliding = false; ds = s; dtx = tx; dty = ty; draw(); return; }
    if (!gliding) { gliding = true; lastT = performance.now(); requestAnimationFrame(glide); }
  }

  // keep the photo inside the screen: centered when smaller, edges never pulled inward when bigger
  function clamp() {
    var W = stage.clientWidth / 2, H = stage.clientHeight / 2;
    if (s * w <= W * 2) tx = -s * w / 2; else tx = Math.min(-W, Math.max(W - s * w, tx));
    if (s * h <= H * 2) ty = -s * h / 2; else ty = Math.min(-H, Math.max(H - s * h, ty));
  }

  function reset(animate) {
    s = 1;
    w = img.offsetWidth; h = img.offsetHeight;
    clamp();
    apply(animate);
  }

  // zoom to scale ns, keeping the photo point under (px, py) (stage-center coords) fixed
  function zoomAt(ns, px, py, animate) {
    ns = Math.min(MAX, Math.max(1, ns));
    tx = px - (px - tx) * ns / s;
    ty = py - (py - ty) * ns / s;
    s = ns;
    clamp();
    apply(animate);
  }

  function local(e) {
    var r = stage.getBoundingClientRect();
    return { x: e.clientX - r.left - r.width / 2, y: e.clientY - r.top - r.height / 2 };
  }

  function show(i) {
    index = (i + photos.length) % photos.length;
    s = 1;
    gliding = false;
    img.style.transform = 'translate(-50%,-50%)';
    img.src = photos[index].src;
    img.alt = photos[index].alt;
    countEl.textContent = (index + 1) + ' / ' + photos.length;
    if (img.complete && img.naturalWidth) reset(false);
  }
  img.addEventListener('load', function() { reset(false); });

  // Open / close animation (after codrops EaseReverseClipMenu): visible tiles fly out radially from the
  // screen center (outer ones first), the viewer opens as a clip from the center; close runs it back.
  // Smooth in-out eases, no overshoot. Timing knobs:
  var FLY = 600;           // px the tiles travel outward
  var SPIN = 20;           // max random rotation (deg)
  var OPEN_TIME = 1.0;     // s, tiles flying out
  var CLIP_TIME = 1.0;     // s, viewer opening / closing
  var CLIP_DELAY = 0.25;   // s, viewer starts opening after the tiles start
  var MAX_DELAY = 0.25;    // s, extra wait for the center tiles (outer ones go first)
  var CLOSE_TIME = 0.9;    // s, tiles gliding back
  // clip = one number (50 = shut to the center point, 0 = full screen). Tweened as a plain number and written
  // out each frame: the browser shortens 'inset(50% 50% 50% 50%)' to 'inset(50%)', and GSAP then pairs the
  // numbers wrong and opens it from the bottom.
  var clip = { p: 50 };
  function applyClip() { box.style.clipPath = 'inset(' + clip.p + '% ' + clip.p + '% ' + clip.p + '% ' + clip.p + '%)'; }
  var flown = [], isOpen = false, tl = null;
  var animated = typeof gsap !== 'undefined' && !window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function visibleTiles() {
    var cx = window.innerWidth / 2, cy = window.innerHeight / 2;
    var maxD = Math.hypot(cx, cy);
    return Array.prototype.slice.call(document.querySelectorAll('#gallery .gallery-masonry-item')).map(function(el) {
      var r = el.getBoundingClientRect();
      if (r.bottom < 0 || r.top > window.innerHeight) return null;
      var dx = r.left + r.width / 2 - cx, dy = r.top + r.height / 2 - cy;
      var d = Math.hypot(dx, dy) || 1;
      return { el: el, x: dx / d * FLY, y: dy / d * FLY, delay: (1 - Math.min(d / maxD, 1)) * MAX_DELAY };
    }).filter(Boolean);
  }

  // hiding the scrollbar would widen the page mid-animation and shift every tile; pad it instead
  function lockScroll(lock) {
    if (lock) {
      var bar = window.innerWidth - document.documentElement.clientWidth;
      document.body.style.paddingRight = bar > 0 ? bar + 'px' : '';
      document.body.style.overflow = 'hidden';
    } else {
      document.body.style.overflow = '';
      document.body.style.paddingRight = '';
    }
  }

  function open(i) {
    photos = Array.prototype.slice.call(document.querySelectorAll('#gallery img'));
    if (!photos.length) return;
    isOpen = true;
    if (tl) tl.kill();
    if (!flown.length) flown = visibleTiles(); // re-open mid-close keeps the same tiles
    window.waveBgPaused = true; // cubes stop computing while the viewer is up (it covers them)
    lockScroll(true);
    box.classList.add('open');
    show(i);
    if (img.decode) img.decode().catch(function() {}); // decode the big photo before the clip reaches it
    if (!animated) { clip.p = 0; applyClip(); return; }
    tl = gsap.timeline();
    applyClip();
    tl.to(clip, { p: 0, duration: CLIP_TIME, ease: 'power3.inOut', onUpdate: applyClip }, CLIP_DELAY);
    flown.forEach(function(t) {
      tl.to(t.el, { x: t.x, y: t.y, opacity: 0, rotation: gsap.utils.random(-SPIN, SPIN),
                    duration: OPEN_TIME, ease: 'power2.inOut', force3D: true }, t.delay);
    });
  }

  function close() {
    if (!isOpen) return;
    isOpen = false;
    function done() {
      box.classList.remove('open');
      lockScroll(false);
      img.removeAttribute('src');
      if (animated) gsap.set(flown.map(function(t) { return t.el; }), { clearProps: 'transform,opacity' });
      flown = [];
      window.waveBgPaused = false;
    }
    if (tl) tl.kill();
    if (!animated) { clip.p = 50; applyClip(); done(); return; }
    // mirror of the open: viewer shuts, then tiles glide home (center ones first), no bounce
    tl = gsap.timeline({ onComplete: done });
    tl.to(clip, { p: 50, duration: CLIP_TIME * 0.8, ease: 'power3.inOut', onUpdate: applyClip }, 0);
    flown.forEach(function(t) {
      tl.to(t.el, { x: 0, y: 0, opacity: 1, rotation: 0, duration: CLOSE_TIME, ease: 'power3.out', force3D: true },
            0.15 + (MAX_DELAY - t.delay));
    });
  }

  document.getElementById('gallery').addEventListener('click', function(e) {
    var item = e.target.closest('.gallery-masonry-item');
    if (!item) return;
    var all = Array.prototype.slice.call(document.querySelectorAll('#gallery .gallery-masonry-item'));
    open(all.indexOf(item));
  });

  document.getElementById('lightbox-close').addEventListener('click', close);
  document.getElementById('lightbox-prev').addEventListener('click', function() { show(index - 1); });
  document.getElementById('lightbox-next').addEventListener('click', function() { show(index + 1); });
  document.getElementById('lightbox-zoom-in').addEventListener('click', function() { zoomAt(s * 1.6, 0, 0, true); });
  document.getElementById('lightbox-zoom-out').addEventListener('click', function() { zoomAt(s / 1.6, 0, 0, true); });

  stage.addEventListener('wheel', function(e) {
    e.preventDefault();
    var p = local(e);
    zoomAt(s * Math.exp(-e.deltaY * 0.0015), p.x, p.y, true);
  }, { passive: false });

  stage.addEventListener('pointerdown', function(e) {
    try { stage.setPointerCapture(e.pointerId); } catch (err) {}
    if (gliding) { s = ds; tx = dtx; ty = dty; gliding = false; } // grab mid-glide: hold it where it is drawn
    pointers[e.pointerId] = local(e);
    moved = false;
    drag = { tx: tx, ty: ty, start: local(e), s: s, dist: 0, mid: null };
    var ids = Object.keys(pointers);
    if (ids.length === 2) {
      var a = pointers[ids[0]], b = pointers[ids[1]];
      drag.dist = Math.hypot(a.x - b.x, a.y - b.y);
      drag.mid = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
    }
  });

  stage.addEventListener('pointermove', function(e) {
    if (!pointers[e.pointerId] || !drag) return;
    pointers[e.pointerId] = local(e);
    var ids = Object.keys(pointers);
    if (ids.length === 2 && drag.dist) {
      // pinch: scale by finger distance around the midpoint, follow the midpoint
      var a = pointers[ids[0]], b = pointers[ids[1]];
      var mid = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
      var ns = Math.min(MAX, Math.max(1, drag.s * Math.hypot(a.x - b.x, a.y - b.y) / drag.dist));
      tx = mid.x - (drag.mid.x - drag.tx) * ns / drag.s;
      ty = mid.y - (drag.mid.y - drag.ty) * ns / drag.s;
      s = ns;
      clamp(); apply(false);
      moved = true;
      return;
    }
    var p = pointers[e.pointerId];
    var dx = p.x - drag.start.x, dy = p.y - drag.start.y;
    if (Math.abs(dx) + Math.abs(dy) > 4) moved = true;
    if (s > 1.01) {
      stage.classList.add('dragging');
      tx = drag.tx + dx; ty = drag.ty + dy;
      clamp(); apply(false);
    }
  });

  function up(e) {
    if (!pointers[e.pointerId]) return;
    var p = pointers[e.pointerId];
    delete pointers[e.pointerId];
    stage.classList.remove('dragging');
    if (Object.keys(pointers).length) { drag = null; return; }
    // swipe left/right to change photo when not zoomed
    if (drag && s <= 1.01 && e.pointerType !== 'mouse') {
      var dx = p.x - drag.start.x;
      if (Math.abs(dx) > 60) show(index + (dx < 0 ? 1 : -1));
    }
    drag = null;
  }
  stage.addEventListener('pointerup', up);
  stage.addEventListener('pointercancel', up);

  // one click (not a drag): on the photo = zoom in there / zoom back out; on the dark area around it = close.
  // Matches the cursor labels ZOOM / DRAG / CLOSE in cursor.js.
  // Hit-test by position: pointer capture (for dragging) makes the browser report the click on the stage,
  // not on the photo, so e.target can't tell them apart.
  function onPhoto(e) {
    var r = img.getBoundingClientRect();
    return e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom;
  }
  stage.addEventListener('click', function(e) {
    if (moved) return;
    if (s > 1.01) { s = 1; clamp(); apply(true); return; }
    if (onPhoto(e)) { var p = local(e); zoomAt(2.5, p.x, p.y, true); }
    else close();
  });

  document.addEventListener('keydown', function(e) {
    if (!box.classList.contains('open')) return;
    if (e.key === 'Escape') close();
    else if (e.key === 'ArrowLeft') show(index - 1);
    else if (e.key === 'ArrowRight') show(index + 1);
    else if (e.key === '+' || e.key === '=') zoomAt(s * 1.6, 0, 0, true);
    else if (e.key === '-') zoomAt(s / 1.6, 0, 0, true);
    else if (e.key === '0') { s = 1; clamp(); apply(true); }
  });

  window.addEventListener('resize', function() { if (box.classList.contains('open')) reset(false); });
})();
document.addEventListener('click', function(e) {
  var nav = document.querySelector('.nav-links');
  var toggle = document.querySelector('.nav-toggle');
  if (nav.classList.contains('open') && !nav.contains(e.target) && !toggle.contains(e.target)) {
    nav.classList.remove('open');
  }
});
</script>
